AWSTemplateFormatVersion: "2010-09-09"
Description: IAM role assumed by GitHub Actions through OIDC to deploy SIS 3

Parameters:
  GitHubSubjectPrefix:
    Type: String
  GitHubEnvironment:
    Type: String

Resources:
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Sub "${GitHubSubjectPrefix}:environment:${GitHubEnvironment}"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn