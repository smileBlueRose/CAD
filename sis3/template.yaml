AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SIS 3

Parameters:
  NetworkStackName:
    Type: String
  SenderEmail:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8000
  ImageUri:
    Type: String
  Env:
    Type: String
    AllowedValues:
      - dev
      - prod

Mappings:
  EnvConfig:
    dev:
      Cpu: "256"
      Memory: "512"
      DesiredCount: 1
      LogRetentionDays: 7
    prod:
      Cpu: "512"
      Memory: "1024"
      DesiredCount: 2
      LogRetentionDays: 30

Resources:
  ##################
  #### Buckets #####
  ##################
  EpisodesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  ################
  #### Queues ####
  ################
  NotifyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 185
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotifyDLQ.Arn
        maxReceiveCount: 5

  EpisodeRuleDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600

  #####################
  #### EventRules #####
  #####################
  EpisodeUploadedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Send Object Created events for .mp4 files in EpisodesBucket to NotifyQueue
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref EpisodesBucket
          object:
            key:
              - suffix: ".mp4"
      Targets:
        - Id: NotifyQueueTarget
          Arn: !GetAtt NotifyQueue.Arn
          RetryPolicy:
            MaximumRetryAttempts: 10
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt EpisodeRuleDLQ.Arn

  ##################
  #### Policies ####
  ##################
  NotifyQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref NotifyQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt NotifyQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt EpisodeUploadedRule.Arn

  EpisodeRuleDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref EpisodeRuleDLQ
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EpisodeRuleDLQ.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt EpisodeUploadedRule.Arn

  ###################
  #### DynamoDBs ####
  ###################
  TitleWatchersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: title_name
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: title_name
          KeyType: HASH
        - AttributeName: email
          KeyType: RANGE

  ProcessedEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_key
          AttributeType: S
      KeySchema:
        - AttributeName: event_key
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  ##########################
  #### Lambda Functions ####
  ##########################
  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: functions/notify/
      Handler: notify.handler
      Runtime: python3.13
      Timeout: 30
      Environment:
        Variables:
          WATCHERS_TABLE: !Ref TitleWatchersTable
          PROCESSED_EVENTS_TABLE: !Ref ProcessedEventsTable
          SENDER_EMAIL: !Ref SenderEmail
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref TitleWatchersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ProcessedEventsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:GetEmailIdentity
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

      Events:
        NotifyQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotifyQueue.Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5

  #########################
  #### Security Groups ####
  #########################
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP from the internet to the watchers API load balancer
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Watchers API tasks, traffic only from the load balancer
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  ########################
  #### Load Balancing ####
  ########################
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets:
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnetAId"
        - !ImportValue
          Fn::Sub: "${NetworkStackName}-PublicSubnetBId"
      SecurityGroups:
        - !Ref AlbSecurityGroup

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      TargetType: ip
      Protocol: HTTP
      Port: !Ref ContainerPort
      VpcId: !ImportValue
        Fn::Sub: "${NetworkStackName}-VpcId"
      HealthCheckPath: /health
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ##################
  #### Clusters ####
  ##################
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  ###############
  #### Roles ####
  ###############
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: watchers-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:DeleteItem
                Resource: !GetAtt TitleWatchersTable.Arn
              - Effect: Allow
                Action:
                  - ses:GetEmailIdentity
                  - ses:CreateEmailIdentity
                Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"

  ####################
  #### Log Groups ####
  ####################
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: !FindInMap [EnvConfig, !Ref Env, LogRetentionDays]

  #############
  #### ECS ####
  #############
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !FindInMap [EnvConfig, !Ref Env, Cpu]
      Memory: !FindInMap [EnvConfig, !Ref Env, Memory]
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
          Environment:
            - Name: WATCHERS_TABLE
              Value: !Ref TitleWatchersTable
            - Name: AWS_DEFAULT_REGION
              Value: !Ref AWS::Region
            - Name: PORT
              Value: !Ref ContainerPort
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: !FindInMap [EnvConfig, !Ref Env, DesiredCount]
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetAId"
            - !ImportValue
              Fn::Sub: "${NetworkStackName}-PrivateSubnetBId"
          SecurityGroups:
            - !Ref TaskSecurityGroup
      LoadBalancers:
        - ContainerName: api
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroup

Outputs:
  ApiUrl:
    Value: !Sub "http://${LoadBalancer.DNSName}"