AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Practice 5
Parameters:
  SenderEmail:
    Type: String
Resources:
  EpisodesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
  NotifyDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  NotifyQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 185
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt:
          - NotifyDLQ
          - Arn
        maxReceiveCount: 5
  EpisodeRuleDLQ:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
  EpisodeUploadedRule:
    Type: AWS::Events::Rule
    Properties:
      Name: episode-uploaded-to-notify-queue
      Description: Send Object Created events for .mp4 files in EpisodesBucket to
        NotifyQueue
      EventPattern:
        source:
        - aws.s3
        detail-type:
        - Object Created
        detail:
          bucket:
            name:
            - Ref: EpisodesBucket
          object:
            key:
            - suffix: .mp4
      Targets:
      - Id: NotifyQueueTarget
        Arn:
          Fn::GetAtt:
          - NotifyQueue
          - Arn
        RetryPolicy:
          MaximumRetryAttempts: 10
          MaximumEventAgeInSeconds: 3600
        DeadLetterConfig:
          Arn:
            Fn::GetAtt:
            - EpisodeRuleDLQ
            - Arn
  NotifyQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: NotifyQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - NotifyQueue
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - EpisodeUploadedRule
                - Arn
  EpisodeRuleDLQPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
      - Ref: EpisodeRuleDLQ
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: events.amazonaws.com
          Action: sqs:SendMessage
          Resource:
            Fn::GetAtt:
            - EpisodeRuleDLQ
            - Arn
          Condition:
            ArnEquals:
              aws:SourceArn:
                Fn::GetAtt:
                - EpisodeUploadedRule
                - Arn
  TitleWatchersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: title_name
        AttributeType: S
      - AttributeName: email
        AttributeType: S
      KeySchema:
      - AttributeName: title_name
        KeyType: HASH
      - AttributeName: email
        KeyType: RANGE
  ProcessedEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: event_key
        AttributeType: S
      KeySchema:
      - AttributeName: event_key
        KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: NotifyFunction
      Handler: notify.handler
      Runtime: python3.13
      Timeout: 30
      Environment:
        Variables:
          WATCHERS_TABLE:
            Ref: TitleWatchersTable
          PROCESSED_EVENTS_TABLE:
            Ref: ProcessedEventsTable
          SENDER_EMAIL:
            Ref: SenderEmail
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: TitleWatchersTable
      - DynamoDBCrudPolicy:
          TableName:
            Ref: ProcessedEventsTable
      - Statement:
        - Effect: Allow
          Action: ses:SendEmail
          Resource:
            Fn::Sub: arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*
      Events:
        NotifyQueueEvent:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt:
              - NotifyQueue
              - Arn
            BatchSize: 10
            MaximumBatchingWindowInSeconds: 5
            FunctionResponseTypes:
            - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5
    Metadata:
      SamResourceId: NotifyFunction
