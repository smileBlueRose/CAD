<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAD Library</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    input, select, button { padding: .4rem .6rem; font-size: 1rem; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; vertical-align: middle; }
    .cover { width: 60px; height: 90px; object-fit: cover; background: #eee; display: block; }
    .upload { display: flex; flex-direction: column; gap: .25rem; }
    .upload input { font-size: .8rem; padding: 0; }
    #error { color: #c00; min-height: 1.2rem; }
    #status { color: #555; min-height: 1.2rem; }
  </style>
</head>
<body>
  <h1>CAD Library</h1>
  <p id="error"></p>
  <p id="status"></p>

  <h2>Authors</h2>
  <form id="author-form">
    <input name="name" placeholder="Name" required>
    <input name="country" placeholder="Country">
    <button type="submit">Add author</button>
  </form>

  <h2>Books</h2>
  <form id="book-form">
    <input name="title" placeholder="Title" required>
    <select name="author_id" id="author-select" required></select>
    <input name="year" type="number" placeholder="Year" min="0" max="2100">
    <input name="total_copies" type="number" placeholder="Copies" min="0" value="1">
    <button type="submit">Add book</button>
  </form>

  <table>
    <thead>
      <tr><th>Cover</th><th>ID</th><th>Title</th><th>Author</th><th>Year</th><th>Available</th><th></th></tr>
    </thead>
    <tbody id="books"></tbody>
  </table>

  <script>
    const API_URL = "";
    const COVERS_API_URL = "https://urqpaql47g.execute-api.eu-central-1.amazonaws.com";
    const ALLOWED_COVER_TYPES = ["image/jpeg", "image/png", "image/webp"];
    const COVER_POLL_ATTEMPTS = 10;
    const COVER_POLL_INTERVAL_MS = 1500;

    const errorBox = document.getElementById("error");
    const statusBox = document.getElementById("status");
    let authors = [];

    async function request(url, options = {}) {
      const response = await fetch(url, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail ? JSON.stringify(body.detail) : `${response.status} ${response.statusText}`);
      }
      return response.status === 204 ? null : response.json();
    }

    function api(path, options) {
      return request(API_URL + path, options);
    }

    function showError(error) {
      errorBox.textContent = error ? error.message : "";
    }

    function showStatus(text) {
      statusBox.textContent = text || "";
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value;
      return div.innerHTML;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function loadAuthors() {
      authors = await api("/authors?limit=100");
      document.getElementById("author-select").innerHTML = authors
        .map(a => `<option value="${a.id}">${escapeHtml(a.name)}</option>`)
        .join("");
    }

    function renderCover(book) {
      if (!book.cover_url) {
        return `<div class="cover"></div>`;
      }
      return `<img class="cover" src="/${encodeURI(book.cover_url)}" alt="">`;
    }

    async function loadBooks() {
      const books = await api("/books?limit=100");
      const names = Object.fromEntries(authors.map(a => [a.id, a.name]));
      document.getElementById("books").innerHTML = books.map(b => `
        <tr>
          <td>
            ${renderCover(b)}
            <div class="upload">
              <input type="file" accept="${ALLOWED_COVER_TYPES.join(",")}" id="file-${b.id}">
              <button data-id="${b.id}" class="upload-cover">Upload cover</button>
            </div>
          </td>
          <td>${b.id}</td>
          <td>${escapeHtml(b.title)}</td>
          <td>${escapeHtml(names[b.author_id] ?? String(b.author_id))}</td>
          <td>${b.year ?? ""}</td>
          <td>${b.available_copies} / ${b.total_copies}</td>
          <td><button data-id="${b.id}" class="delete">Delete</button></td>
        </tr>`).join("");
    }

    async function refresh() {
      try {
        showError(null);
        await loadAuthors();
        await loadBooks();
      } catch (error) {
        showError(error);
      }
    }

    async function waitForNewCover(bookId, previousCoverUrl) {
      for (let attempt = 0; attempt < COVER_POLL_ATTEMPTS; attempt++) {
        await sleep(COVER_POLL_INTERVAL_MS);
        const book = await api(`/books/${bookId}`);
        if (book.cover_url && book.cover_url !== previousCoverUrl) {
          return true;
        }
      }
      return false;
    }

    async function uploadCover(bookId) {
      const file = document.getElementById(`file-${bookId}`).files[0];
      if (!file) {
        throw new Error("Choose an image first");
      }
      if (!ALLOWED_COVER_TYPES.includes(file.type)) {
        throw new Error(`Unsupported file type: ${file.type || "unknown"}`);
      }

      const previous = await api(`/books/${bookId}`);

      showStatus("Requesting upload URL...");
      const { url } = await request(`${COVERS_API_URL}/books/${bookId}/cover-upload-url`, {
        method: "POST",
        body: JSON.stringify({ content_type: file.type }),
      });

      showStatus("Uploading image...");
      const uploadResponse = await fetch(url, {
        method: "PUT",
        headers: { "Content-Type": file.type },
        body: file,
      });
      if (!uploadResponse.ok) {
        throw new Error(`Upload failed: ${uploadResponse.status}`);
      }

      showStatus("Generating thumbnail...");
      const ready = await waitForNewCover(bookId, previous.cover_url);
      showStatus(ready ? "Cover updated" : "Thumbnail is still processing, refresh the page later");
      await loadBooks();
    }

    document.getElementById("author-form").addEventListener("submit", async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        await api("/authors", {
          method: "POST",
          body: JSON.stringify({ name: data.name, country: data.country || null }),
        });
        event.target.reset();
        await refresh();
      } catch (error) {
        showError(error);
      }
    });

    document.getElementById("book-form").addEventListener("submit", async event => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      try {
        await api("/books", {
          method: "POST",
          body: JSON.stringify({
            title: data.title,
            author_id: Number(data.author_id),
            year: data.year ? Number(data.year) : null,
            total_copies: Number(data.total_copies || 1),
          }),
        });
        event.target.reset();
        await refresh();
      } catch (error) {
        showError(error);
      }
    });

    document.getElementById("books").addEventListener("click", async event => {
      const target = event.target;
      const bookId = target.dataset.id;
      if (!bookId) return;
      try {
        showError(null);
        if (target.classList.contains("delete")) {
          await api(`/books/${bookId}`, { method: "DELETE" });
          await refresh();
        } else if (target.classList.contains("upload-cover")) {
          target.disabled = true;
          await uploadCover(bookId);
        }
      } catch (error) {
        showError(error);
        showStatus(null);
      } finally {
        target.disabled = false;
      }
    });

    refresh();
  </script>
</body>
</html>
